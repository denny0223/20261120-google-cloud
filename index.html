  <div><span class="panel-label">Verifier</span><h2>檢查改動</h2><p>看 diff、跑測試，<br />請原作者修正問題。</p></div>
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="Build with Gemini" data-class="archetype-table directory-table" data-theme="build-with-gemini" data-lang="zh-TW" lang="zh-TW" class="archetype-table directory-table" data-marpit-pagination="19" style="--paginate:true;--footer:Build with Gemini;--class:archetype-table directory-table;--theme:build-with-gemini;--lang:zh-TW;" data-marpit-pagination-total="28" data-size="16:9">

<table>
<thead>
<tr>
<th>工作目錄</th>
<th>分支</th>
<th>用途</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>md-render.nvim/</code></td>
<td><code>main</code></td>
<td>日常開發</td>
</tr>
<tr>
<td><code>md-render-docs/</code></td>
<td><code>docs-update</code></td>
<td>文件修改</td>
</tr>
<tr>
<td><code>md-render-test/</code></td>
<td><code>test-preview</code></td>
<td>預覽實驗</td>
</tr>
</tbody>
</table>

<h1 id="git-worktree%E4%B8%8D%E7%94%A8%E5%86%8D-clone-%E4%B8%89%E4%BB%BD"><code>git worktree</code>：不用再 clone 三份</h1>
<div class="layout-two">
  <div>
    <span class="panel-label">指令</span>
    <h2>從目前的 repo 新增工作目錄</h2>
<pre><code class="language-sh">git worktree add -b docs-update \
  ../md-render-docs

git worktree list
</code></pre>
  </div>
  <div>
    <span class="panel-label">實際輸出</span>
    <h2>工作目錄</h2>
    <pre class="worktree-list"><samp>/work/md-render.nvim 3eb014c [main]
/work/md-render-docs 3eb014c [docs-update]
/work/md-render-test 3eb014c [test-preview]</samp></pre>
    <p>第一列是主工作目錄，<br />後兩列是新增的 worktree。</p>
  </div>
</div>
<footer>Build with Gemini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="Build with Gemini" data-class="archetype-two-panel" data-theme="build-with-gemini" data-lang="zh-TW" lang="zh-TW" class="archetype-two-panel" data-marpit-pagination="21" style="--paginate:true;--footer:Build with Gemini;--class:archetype-two-panel;--theme:build-with-gemini;--lang:zh-TW;" data-marpit-pagination-total="28" data-size="16:9">

  <div>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="Build with Gemini" data-class="archetype-media" data-theme="build-with-gemini" data-lang="zh-TW" lang="zh-TW" class="archetype-media" data-marpit-pagination="22" style="--paginate:true;--footer:Build with Gemini;--class:archetype-media;--theme:build-with-gemini;--lang:zh-TW;" data-marpit-pagination-total="28" data-size="16:9">
<h1 id="%E7%94%A8-tmuxbr%E5%92%8C%E5%A4%9A%E5%80%8B-agent-%E4%BA%92%E5%8B%95">用 tmux<br />和多個 Agent 互動</h1>
<div class="layout-media">
  <div>
    <p>用 <code>pane</code> 上下分割，<br />同時看 Claude Code 和 Codex。</p>
    <p>用 <code>window</code> 分開不同工作，<br />從「開發」切到「審查」。</p>
  </div>
  <div class="media-slot">
    <img src="assets/demo/tmux-panes.png" alt="一個 tmux window 上下分割為 Claude Code 和 Codex 兩個 pane。底部列出開發和審查兩個 window。" />
  </div>
</div>
<footer>Build with Gemini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="Build with Gemini" data-class="archetype-media swarm-board" data-theme="build-with-gemini" data-lang="zh-TW" lang="zh-TW" class="archetype-media swarm-board" data-marpit-pagination="23" style="--paginate:true;--footer:Build with Gemini;--class:archetype-media swarm-board;--theme:build-with-gemini;--lang:zh-TW;" data-marpit-pagination-total="28" data-size="16:9">
<h1 id="swarm-boardbr%E7%8F%BE%E5%9C%A8%E8%BC%AA%E5%88%B0%E8%AA%B0"><code>/swarm board</code><br />現在輪到誰？</h1>
<div class="layout-media">
  <div>
    <p><strong>Roster</strong> · 5 位成員<br />4 位等待，<code>verifier</code> 工作中。</p>
    <p><strong>Posts</strong> · 6 則貼文<br />最後兩則送給 <code>verifier</code> 審查。</p>
    <p><strong>Message</strong> · 第 6 則<br /><code>importer</code> 送審，附上分支、commit 和檔案清單。</p>
  </div>
  <div class="media-slot">
    <a href="assets/demo/antigravity-board.png" target="_blank" rel="noopener"><img src="assets/demo/antigravity-board.png" width="3840" height="2160" alt="Antigravity 完整 Swarm board。Roster 顯示 verifier 正在工作，Posts 選到第 6 則，Message 展開 importer 交給 verifier 的送審內容。" /></a>
  </div>
</div>
<p>
  <span>切換對話　<a href="https://code.claude.com/docs/en/agent-view"><code>claude agents</code></a> · <a href="https://learn.chatgpt.com/docs/developer-commands?surface=cli#codex-agents"><code>codex agents</code></a></span>
  <span>Antigravity 背景 Agent　<a href="https://antigravity.google/docs/cli/commands/agents/"><code>/agents</code></a>　｜　跨工具看狀態　<a href="https://herdr.dev/tui/docs/agents/">Herdr</a></span>
</p>
<footer>Build with Gemini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer="Build with Gemini" data-class="archetype-rows" data-theme="build-with-gemini" data-lang="zh-TW" lang="zh-TW" class="archetype-rows" data-marpit-pagination="24" style="--paginate:true;--footer:Build with Gemini;--class:archetype-rows;--theme:build-with-gemini;--lang:zh-TW;" data-marpit-pagination-total="28" data-size="16:9">
<h1 id="%E4%B8%89%E5%80%8B%E5%B7%A5%E5%85%B7br%E5%90%84%E7%AE%A1%E4%BB%80%E9%BA%BC">三個工具，<br />各管什麼？</h1>
<dl class="term-rows">
  <dt>Git worktree</dt><dd>修改放在哪裡？<br /><strong>工作目錄／分支</strong></dd>
  <dt>tmux</dt><dd>哪些終端要放在一起看？<br /><strong>window／pane</strong></dd>
  <dt>Antigravity</dt><dd>誰負責哪個子任務？<br /><strong>Agent／審查</strong></dd>
</dl>
<footer>Build with Gemini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="Build with Gemini" data-class="archetype-two-panel" data-theme="build-with-gemini" data-lang="zh-TW" lang="zh-TW" class="archetype-two-panel" data-marpit-pagination="25" style="--paginate:true;--footer:Build with Gemini;--class:archetype-two-panel;--theme:build-with-gemini;--lang:zh-TW;" data-marpit-pagination-total="28" data-size="16:9">

<div class="layout-two">
  <div><span class="panel-label">規則範例</span><h2>Rule</h2><p>改檔前，先確認計畫。</p></div>
  <div><span class="panel-label">流程範例</span><h2>Skill</h2><p>交付前，看 diff、跑相關測試，<br />再逐項核對需求。</p></div>
</div>
<p><a href="https://antigravity.google/docs/commands/learn/">Antigravity Learn</a></p>
<footer>Build with Gemini</footer>
